name: Translation fix
description: Report wrong, awkward, or untranslated text in one of the nine languages.
title: "[Translation] "
labels: ["bug"]
assignees: ["XeldarAlz"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping the phone read naturally in your language.

        You can also fix it yourself, in the browser, with no code or build: the [translator guide](https://github.com/XeldarAlz/FFXIV-Aetherphone/blob/dev/docs/translating.md) walks through editing a single language file and opening a pull request. Filing it here instead is completely fine.

  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Deutsch (de)
        - English (en)
        - Español (es)
        - Français (fr)
        - 日本語 (ja)
        - Português (Brasil) (pt)
        - Русский (ru)
        - Türkçe (tr)
        - 中文 (zh)
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where does it appear?
      description: The app and screen where you saw the text.
      placeholder: "Timers, the retainer venture card"
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current text
      description: The text exactly as the phone shows it today. A screenshot works too.
    validations:
      required: true

  - type: textarea
    id: suggested
    attributes:
      label: Suggested text
      description: Your proposed wording. Leave it empty if you only want to flag the problem.

  - type: textarea
    id: why
    attributes:
      label: Why is this better?
      description: Wrong meaning, wrong register, grammar, truncation, or an FFXIV term that the official localization renders differently. For game terms, the official in-game wording wins.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues for this text.
          required: true
        - label: For FFXIV terms, I checked how the official game localization writes it (optional).

name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

# A pull request only needs its newest commit checked, so a push cancels the
# run it supersedes. A push to dev or master still runs to completion, and the
# queue behind it collapses to the newest commit, which carries every commit
# it displaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Cheap gates that don't need the SDK or Dalamud; run them first so a
  # version-sync mistake or a style break fails fast without burning the
  # full build. Each guard lives in tools/guards/check, which contributors
  # and agent hooks run locally, so CI and a local run can never disagree.
  guards:
    name: Guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify version sync (Directory.Build.props ↔ repo.json)
        shell: bash
        run: tools/guards/check version-sync

      - name: Verify UI scale seam
        shell: bash
        run: tools/guards/check ui-scale

      - name: Verify no em dashes
        shell: bash
        run: tools/guards/check em-dash

      - name: Verify no async void
        shell: bash
        run: tools/guards/check async-void

      - name: Verify no new LINQ
        shell: bash
        run: tools/guards/check linq

      - name: Verify clock format seam
        shell: bash
        run: tools/guards/check clock-format

      - name: Verify layering
        shell: bash
        run: tools/guards/check layering

      - name: Verify no underscore prefixed fields
        shell: bash
        run: tools/guards/check underscore-fields

      - name: Verify no byte order marks
        shell: bash
        run: tools/guards/check bom

      - name: Verify namespace matches folder
        shell: bash
        run: tools/guards/check namespace

  # Full build. Needs Dalamud present at the standard plugin path so
  # Dalamud.NET.Sdk can resolve $(DalamudLibPath).
  build:
    name: Build (Windows)
    needs: guards
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Defender scans every file the compiler, the package cache and the
      # Dalamud download write on this runner. All of it is throwaway, so the
      # exclusions cost nothing and remove the scan from the build's path.
      - name: Exclude build folders from Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE
            Add-MpPreference -ExclusionPath "$env:USERPROFILE\.nuget\packages"
            Add-MpPreference -ExclusionPath "$env:AppData\XIVLauncher"
            Add-MpPreference -ExclusionPath "$env:ProgramFiles\dotnet"
          } catch {
            Write-Host "Defender is not managing this runner: $_"
          }

      # The guards already passed on Linux. This run proves the script and its
      # cmd wrapper still work for contributors on Windows.
      - name: Verify guards run on Windows
        shell: cmd
        run: tools\guards\check.cmd

      # The package cache is keyed on the lock files plus the test project,
      # which has no lock file of its own, so a dependency bump anywhere
      # produces a fresh key and an unchanged tree restores from the cache.
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            src/Aetherphone/packages.lock.json
            src/ManagedDoom/packages.lock.json
            src/Aetherphone.Tests/Aetherphone.Tests.csproj

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dalamudUrl = "https://goatcorp.github.io/dalamud-distrib/latest.zip"
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null
          Invoke-WebRequest -Uri $dalamudUrl -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dalamudDir -Force
          Remove-Item dalamud.zip

      - name: Restore
        run: dotnet restore Aetherphone.sln --locked-mode

      - name: Build (Release)
        run: dotnet build Aetherphone.sln --configuration Release --no-restore

      - name: Run tests
        run: >
          dotnet test Aetherphone.sln --configuration Release --no-build
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      # The console log on a Windows runner is long and the assertion is buried
      # in it, so the trx goes up whenever the suite is red.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/test-results.trx
          if-no-files-found: warn
          retention-days: 14

      # Every pull request gets a loadable build: reviewing this plugin means
      # opening the phone in game, so the reviewer needs the zip, not a log.
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: Aetherphone-plugin
          path: src/Aetherphone/bin/Release/Aetherphone/latest.zip
          if-no-files-found: error
          retention-days: 14
